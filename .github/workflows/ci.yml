name: ci

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart format --set-exit-if-changed .
        working-directory: 06-week-6-authentication
      - run: flutter pub get
        working-directory: 06-week-6-authentication
      - run: flutter analyze
        working-directory: 06-week-6-authentication
      - run: flutter test
        working-directory: 06-week-6-authentication
